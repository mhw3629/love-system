<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>💕 登录 - 我们的世界</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #1a0b1a, #2d1b2d, #1a0b1a);
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Microsoft YaHei", sans-serif;
            padding: 20px;
        }
        
        .container {
            background: rgba(26, 11, 26, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 40px;
            padding: 50px 40px;
            max-width: 420px;
            width: 100%;
            border: 1px solid rgba(255, 182, 193, 0.15);
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
            animation: fadeIn 0.6s ease;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9) translateY(20px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
        
        .logo {
            text-align: center;
            font-size: 48px;
            margin-bottom: 10px;
            animation: heartBeat 2s infinite;
        }
        
        @keyframes heartBeat {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        
        .title {
            text-align: center;
            color: #ffb6c1;
            font-size: 24px;
            font-weight: 300;
            letter-spacing: 4px;
            margin-bottom: 30px;
        }
        
        .title small {
            display: block;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.3);
            letter-spacing: 2px;
            margin-top: 8px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            color: rgba(255, 255, 255, 0.5);
            font-size: 13px;
            letter-spacing: 2px;
            display: block;
            margin-bottom: 8px;
        }
        
        .form-group input {
            width: 100%;
            padding: 14px 18px;
            border-radius: 16px;
            border: 1px solid rgba(255, 182, 193, 0.15);
            background: rgba(0, 0, 0, 0.3);
            color: #f0e0e6;
            font-size: 16px;
            outline: none;
            transition: all 0.3s;
            box-sizing: border-box;
        }
        
        .form-group input:focus {
            border-color: #ff6b9d;
            box-shadow: 0 0 25px rgba(255, 107, 157, 0.1);
        }
        
        .form-group input::placeholder {
            color: rgba(255, 255, 255, 0.2);
        }
        
        .btn {
            width: 100%;
            padding: 14px;
            border-radius: 50px;
            border: none;
            font-size: 17px;
            cursor: pointer;
            transition: all 0.3s;
            font-weight: 500;
            letter-spacing: 3px;
            margin-top: 10px;
        }
        
        .btn-primary {
            background: linear-gradient(135deg, #ff6b9d, #ff1493);
            color: white;
            box-shadow: 0 8px 30px rgba(255, 20, 147, 0.25);
        }
        
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px rgba(255, 20, 147, 0.35);
        }
        
        .btn-primary:active {
            transform: translateY(0);
        }
        
        .btn-secondary {
            background: transparent;
            color: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-top: 5px;
        }
        
        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.05);
        }
        
        .switch-text {
            text-align: center;
            margin-top: 20px;
            color: rgba(255, 255, 255, 0.3);
            font-size: 14px;
            letter-spacing: 1px;
        }
        
        .switch-text a {
            color: #ffb6c1;
            cursor: pointer;
            text-decoration: none;
            transition: 0.3s;
        }
        
        .switch-text a:hover {
            color: #ff1493;
        }
        
        .message {
            text-align: center;
            padding: 12px;
            border-radius: 12px;
            font-size: 14px;
            margin-bottom: 15px;
            display: none;
            letter-spacing: 1px;
        }
        
        .message.success {
            display: block;
            background: rgba(0, 255, 0, 0.08);
            color: #7dffb3;
            border: 1px solid rgba(0, 255, 0, 0.1);
        }
        
        .message.error {
            display: block;
            background: rgba(255, 0, 0, 0.08);
            color: #ff6b6b;
            border: 1px solid rgba(255, 0, 0, 0.1);
        }
        
        .heart-decoration {
            text-align: center;
            margin-top: 25px;
            color: rgba(255, 255, 255, 0.06);
            font-size: 12px;
            letter-spacing: 2px;
        }
        
        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
                border-radius: 28px;
            }
            .title {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">💕</div>
        <div class="title">
            欢迎回来
            <small>这里只属于我们两个人</small>
        </div>
        
        <div id="message" class="message"></div>
        
        <!-- 登录表单 -->
        <div id="loginForm">
            <div class="form-group">
                <label>👤 用户名</label>
                <input type="text" id="loginUsername" placeholder="输入用户名" value="admin">
            </div>
            <div class="form-group">
                <label>🔒 密码</label>
                <input type="password" id="loginPassword" placeholder="输入密码" value="123456">
            </div>
            <button class="btn btn-primary" onclick="handleLogin()">💕 进入我们的世界</button>
            <div class="switch-text">
                还没有账号？ <a onclick="showRegister()">注册一个吧 💖</a>
            </div>
        </div>
        
        <!-- 注册表单（默认隐藏） -->
        <div id="registerForm" style="display:none;">
            <div class="form-group">
                <label>👤 用户名</label>
                <input type="text" id="registerUsername" placeholder="取个专属昵称">
            </div>
            <div class="form-group">
                <label>🔒 密码</label>
                <input type="password" id="registerPassword" placeholder="设置密码">
            </div>
            <div class="form-group">
                <label>📧 邮箱（可选）</label>
                <input type="email" id="registerEmail" placeholder="你的邮箱">
            </div>
            <button class="btn btn-primary" onclick="handleRegister()">💖 注册</button>
            <div class="switch-text">
                已有账号？ <a onclick="showLogin()">去登录 💕</a>
            </div>
        </div>
        
        <div class="heart-decoration">❤️ 我们的世界 · 只属于你 ❤️</div>
    </div>
    
    <script>
        const API_BASE_URL = 'http://localhost:3000';
        
        function showMessage(text, type) {
            const el = document.getElementById('message');
            el.textContent = text;
            el.className = 'message ' + type;
        }
        
        function showRegister() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
            document.querySelector('.title small').textContent = '创建一个属于我们的账号';
            document.getElementById('message').className = 'message';
        }
        
        function showLogin() {
            document.getElementById('loginForm').style.display = 'block';
            document.getElementById('registerForm').style.display = 'none';
            document.querySelector('.title small').textContent = '这里只属于我们两个人';
            document.getElementById('message').className = 'message';
        }
        
        async function handleLogin() {
            const username = document.getElementById('loginUsername').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            
            if (!username || !password) {
                showMessage('请填写用户名和密码 💕', 'error');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showMessage(result.message, 'success');
                    // 保存用户信息
                    localStorage.setItem('love_user', JSON.stringify(result.data));
                    // 跳转到主页面
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1000);
                } else {
                    showMessage(result.message, 'error');
                }
            } catch (error) {
                showMessage('网络错误，请确保服务器已启动 ❌', 'error');
                console.error(error);
            }
        }
        
        async function handleRegister() {
            const username = document.getElementById('registerUsername').value.trim();
            const password = document.getElementById('registerPassword').value.trim();
            const email = document.getElementById('registerEmail').value.trim();
            
            if (!username || !password) {
                showMessage('用户名和密码不能为空 💕', 'error');
                return;
            }
            
            if (password.length < 4) {
                showMessage('密码至少4位哦 💕', 'error');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, email })
                });
                
                const result = await response.json();
                
                if (result.success) {
                    showMessage(result.message, 'success');
                    setTimeout(() => {
                        showLogin();
                        document.getElementById('loginUsername').value = username;
                        document.getElementById('loginPassword').value = password;
                    }, 1500);
                } else {
                    showMessage(result.message, 'error');
                }
            } catch (error) {
                showMessage('网络错误，请确保服务器已启动 ❌', 'error');
                console.error(error);
            }
        }
        
        // 按回车键登录
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                if (document.getElementById('loginForm').style.display !== 'none') {
                    handleLogin();
                } else {
                    handleRegister();
                }
            }
        });
    </script>
</body>
</html>
